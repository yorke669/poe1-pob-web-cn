<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE1 天赋树模拟器</title>
<style>
  :root {
    --bg: #07090d; --panel: #0f131a; --border: #1f2733; --ink: #d7dee8;
    --dim: #8b97a8; --gold: #e8c56a; --cyan: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; color: var(--gold); white-space: nowrap; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  select, input[type=search], button {
    background: #151b24; color: var(--ink); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none;
  }
  select:focus, input[type=search]:focus { border-color: #3b82f6; }
  button { cursor: pointer; }
  button:hover { background: #1c2431; }
  .spacer { flex: 1; }
  .stat { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--gold); font-size: 14px; }

  nav#tabs { flex: none; display: flex; gap: 6px; padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: #151b24; color: var(--dim); font-weight: 600; cursor: pointer; font-size: 13px; text-decoration: none; }
  .tab.active { color: var(--bg); background: var(--gold); border-color: var(--gold); }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--bg); }
  canvas { position: absolute; inset: 0; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  aside { flex: none; width: 330px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  aside .block { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  aside .scroll { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .sec-title { font-size: 12px; color: var(--dim); margin-bottom: 6px; letter-spacing: .5px; }
  .node-name { font-size: 14px; color: var(--gold); font-weight: 600; margin-bottom: 2px; }
  .node-type { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  .stats { margin: 0; padding-left: 16px; color: #a9b6c6; font-size: 12px; }
  .stats li { margin-bottom: 2px; }
  .reminder { margin-top: 6px; font-size: 11px; color: var(--dim); font-style: italic; line-height: 1.6; }
  .hint { color: var(--dim); font-size: 12px; }
  .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .kv span:last-child { color: var(--gold); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  #tooltip { position: absolute; pointer-events: none; z-index: 20; max-width: 320px; background: rgba(10,14,20,.96); border: 1px solid #2c3646; border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.5); display: none; }
  #tooltip .t-name { color: var(--gold); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-type { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  #tooltip ul { margin: 0; padding-left: 16px; font-size: 12px; color: #a9b6c6; }

  .result-item { width: 100%; text-align: left; margin-bottom: 4px; display: block; background: #151b24; border: 1px solid var(--border); border-radius: 6px; }
  .result-item small { color: var(--dim); }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }

  #searchbar { flex: none; border-top: 1px solid var(--border); background: var(--panel); padding: 8px 14px; max-height: 240px; overflow-y: auto; display: flex; gap: 24px; align-items: flex-start; }
  #searchbar .search-section { flex: 1; min-width: 260px; }
  #searchbar .legend-section { flex: none; max-width: 540px; }
  #searchbar .row { display: flex; align-items: center; gap: 10px; }
  #searchbar #search { flex: 1; max-width: 560px; }
  #searchbar #search-result { margin-top: 8px; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>PoE1 天赋树</h1>
  <div class="field">
    <label for="sel-data">数据源</label>
    <select id="sel-data"></select>
  </div>
  <div class="field">
    <label for="sel-class">职业</label>
    <select id="sel-class"></select>
  </div>
  <div class="field">
    <label for="sel-asc">升华</label>
    <select id="sel-asc"></select>
  </div>
  <div class="field">
    <label for="sel-radius">珠宝半径</label>
    <select id="sel-radius">
      <option value="960">Small 960</option>
      <option value="1440">Medium 1440</option>
      <option value="1800" selected>Large 1800</option>
      <option value="2400">Very Large 2400</option>
      <option value="2880">Massive 2880</option>
    </select>
  </div>
  <div class="field"><label><input type="checkbox" id="ck-ring"> 环形</label></div>
  <div class="field"><label><input type="checkbox" id="ck-cluster"> 显示全部珠宝插槽</label></div>
  <div class="spacer"></div>
  <div class="stat">已用点数 <b id="stat-points">0</b></div>
  <div class="stat">插槽 <b id="stat-sockets">0</b></div>
  <div class="stat">升华点 <b id="stat-asc">0</b></div>
  <button id="btn-reset">重置</button>
  <button id="btn-fit">全览</button>
</header>

<nav id="tabs">
  <a class="tab active" href="index.html">天赋模拟</a>
  <a class="tab" href="tj.html">军团珠宝</a>
</nav>

<main>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="tooltip"></div>
    <div class="loading" id="loading">载入天赋树数据…</div>
  </div>
  <aside>
    <div class="block" id="jewel-block" style="display:none">
      <div class="sec-title">珠宝插槽影响范围</div>
      <div class="kv"><span>插槽</span><span id="jewel-name">-</span></div>
      <div class="kv"><span>半径</span><span id="jewel-radius">-</span></div>
      <div class="kv"><span>范围内可影响节点</span><span id="jewel-count">-</span></div>
      <div class="hint" style="margin-top:4px">规则同 PoB / pobzh：排除升华、专精、插槽、职业起点与未放置条目；定位代理节点只计数不列出。</div>
      <div id="jewel-detail" style="margin-top:6px;max-height:150px;overflow-y:auto"></div>
    </div>
    <div class="scroll" id="detail">
      <div class="hint">点击天赋即可分配（需与已点亮天赋用连线连通）；点击已分配天赋可取消。右侧显示当前选中天赋的信息。</div>
    </div>
  </aside>
</main>
<div id="searchbar">
  <div class="search-section">
    <div class="sec-title">搜索天赋（名称 / 词条）</div>
    <div class="row">
      <input type="search" id="search" placeholder="例如：Elemental Overload / increased Life">
      <span class="hint">点结果可在树上定位</span>
    </div>
    <div id="search-result"></div>
  </div>
  <div class="legend-section">
    <div class="sec-title">图例</div>
    <div class="legend">
      <div><i style="background:#e8c56a"></i>已分配</div>
      <div><i style="background:#566274"></i>未分配</div>
      <div><i style="background:#8a5d20"></i>基石</div>
      <div><i style="background:#806b3b"></i>中点</div>
      <div><i style="background:#5d4b86"></i>专精</div>
      <div><i style="background:#426b80"></i>珠宝插槽</div>
      <div><i style="background:#67e8f9"></i>可点</div>
      <div><i style="background:#f2b84b"></i>珠宝半径</div>
      <div style="width:100%;margin-top:2px">滚轮缩放 · 拖拽平移 · 点击天赋分配/取消 · 点插槽看半径</div>
    </div>
  </div>
</div>

<script src="data/translations.js"></script>
<script src="tree-core.js"></script>
<script>
(function () {
  "use strict";
  var CLASS_NAMES = ["贵族 Scion", "野蛮人 Marauder", "游侠 Ranger", "女巫 Witch",
                     "决斗者 Duelist", "圣堂武僧 Templar", "暗影 Shadow"];
  var DATA_FILES = [
    { file: "poe1-tree-3.29.js", label: "3.29 官方 Lua 生成" },
    { file: "poe1-tree-3.26.js", label: "3.26 官方 Lua 生成" },
    { file: "poe1-tree.js", label: "PoB v2.67.2（原抓取，3_29）" }
  ];

  var selData = document.getElementById("sel-data");
  var selClass = document.getElementById("sel-class");
  var selAsc = document.getElementById("sel-asc");
  var searchInput = document.getElementById("search");
  var searchResult = document.getElementById("search-result");

  DATA_FILES.forEach(function (d, i) {
    var op = document.createElement("option");
    op.value = String(i); op.textContent = d.label;
    selData.appendChild(op);
  });

  var tree = createTreeView({
    canvas: document.getElementById("canvas"),
    stage: document.getElementById("stage"),
    tooltip: document.getElementById("tooltip"),
    detail: document.getElementById("detail"),
    jewelBlock: document.getElementById("jewel-block"),
    jewelName: document.getElementById("jewel-name"),
    jewelRadius: document.getElementById("jewel-radius"),
    jewelCount: document.getElementById("jewel-count"),
    jewelDetail: document.getElementById("jewel-detail"),
    statPoints: document.getElementById("stat-points"),
    statSockets: document.getElementById("stat-sockets"),
    statAsc: document.getElementById("stat-asc"),
    mode: "build",
    fillAsc: function (list) {
      selAsc.innerHTML = '<option value="">无</option>';
      list.forEach(function (a) {
        var op = document.createElement("option");
        op.value = a.name; op.textContent = a.name + (a.isBloodline ? "（血系）" : "");
        selAsc.appendChild(op);
      });
      selAsc.value = "";
    }
  });

  tree.load([DATA_FILES[Number(selData.value)]]).then(function () {
    document.getElementById("loading").style.display = "none";
    var cs = tree.getClassStarts();
    selClass.innerHTML = "";
    cs.forEach(function (c, i) {
      var op = document.createElement("option");
      op.value = String(i);
      op.textContent = CLASS_NAMES[c.node.classStartIndex] || c.node.name;
      selClass.appendChild(op);
    });
    selClass.value = "0";
    tree.focusClass();
  }).catch(function (e) { alert("加载失败: " + e.message); });

  selData.addEventListener("change", function () {
    var d = DATA_FILES[Number(selData.value)];
    tree.load([d]).then(function () {
      var cs = tree.getClassStarts();
      selClass.innerHTML = "";
      cs.forEach(function (c, i) {
        var op = document.createElement("option");
        op.value = String(i); op.textContent = CLASS_NAMES[c.node.classStartIndex] || c.node.name;
        selClass.appendChild(op);
      });
      selClass.value = "0"; tree.focusClass();
    });
  });

  selClass.addEventListener("change", function () { tree.setClassIndex(Number(selClass.value)); });
  selAsc.addEventListener("change", function () { tree.setAsc(selAsc.value); });
  document.getElementById("sel-radius").addEventListener("change", function (e) { tree.setRadius(Number(e.target.value)); });
  document.getElementById("ck-ring").addEventListener("change", function (e) { tree.setRing(e.target.checked); });
  document.getElementById("ck-cluster").addEventListener("change", function (e) { tree.setShowCluster(e.target.checked); });
  document.getElementById("btn-reset").addEventListener("click", function () { tree.rebuild(true); });
  document.getElementById("btn-fit").addEventListener("click", function () { tree.fit(); });

  // 搜索
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function cleanNewlines(s) {
    return String(s).replace(/\\+n/g, " ").replace(/\n/g, " ").replace(/\s+/g, " ").trim();
  }
  function tr(text, table) {
    if (text == null) return text;
    var k = String(text).trim(); if (!k) return text;
    var dict = (window.POE1_TREE_TR && window.POE1_TREE_TR[table]) || {};
    return dict[cleanNewlines(k)] || cleanNewlines(text);
  }
  searchInput.addEventListener("input", function () {
    var q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResult.innerHTML = ""; return; }
    var NODES = tree.getNODES(), hits = [];
    Object.keys(NODES).forEach(function (id) {
      var n = NODES[id];
      if (n.group === undefined || n.group < 0) return;
      var nameEn = (n.name || ""), nameZh = tr(nameEn, "name");
      if (nameEn.toLowerCase().indexOf(q) >= 0 || nameZh.toLowerCase().indexOf(q) >= 0) { hits.push({ id: id, n: n }); return; }
      var statsZh = (n.stats || []).map(function (s) { return tr(s, "stat"); }).join(" ");
      if ((statsZh + " " + (n.stats || []).join(" ")).toLowerCase().indexOf(q) >= 0) hits.push({ id: id, n: n });
      if (hits.length > 200) return;
    });
    searchResult.innerHTML = hits.slice(0, 40).map(function (h) {
      var zh = tr(h.n.name, "name");
      return '<button class="result-item" data-node="' + h.id + '">' + escapeHtml(zh || h.n.name) +
        "<br><small>" + (h.n.type || "") + " · " + h.id + "</small></button>";
    }).join("") || '<div class="hint">无匹配</div>';
  });
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("[data-node]") : null;
    if (!btn) return;
    tree.focusNode(btn.getAttribute("data-node"));
  });
})();
</script>
</body>
</html>
